function waveAt(zWorld, t){
  const d = 0.55 + 0.45*easeOut(seg(t, 14.0, 42));
  const amp = 1.65 * d;
  const ahead = Math.exp(-Math.pow((zWorld - 3.6)/1.5, 2));
  const behind = Math.exp(-Math.pow((zWorld + 0.6)/2.0, 2));
  return amp * (ahead*1.0 - behind*0.5);
}

const profIdx = [];
{
  // rows: 0 = surface, 1 = asphalt base, 2 = granular base, 3 = subgrade bottom
  const rowOff = [0.0, -0.34, -1.12];
  const rowCol = [[0.30,0.32,0.37],[0.20,0.22,0.26],[0.62,0.56,0.45]];
  for (let r=0;r<3;r++){
    for (let k=0;k<=PROF_N;k++){
      const vi = (r*(PROF_N+1) + k);
      profPos[vi*3+0] = PROF_X;
      profPos[vi*3+1] = rowOff[r];
      profPos[vi*3+2] = PROF_Z0 + (PROF_Z1-PROF_Z0)*k/PROF_N;

    }
  }
}

// ---------------------------------------------------------------- 2D character (sprite)
function drawWorker(pose){
  const c = document.createElement('canvas'); c.width = 460; c.height = 900;
  const g = c.getContext('2d');
  const ink = '#241726';
  g.lineJoin='round'; g.lineCap='round';
  const O = (w) => { g.lineWidth=w; g.strokeStyle=ink; };
  // legs
  O(26); g.fillStyle='#3a4a63';
  g.beginPath(); g.roundRect(178, 600, 44, 230, 18); g.fill(); g.stroke();
  g.beginPath(); g.roundRect(240, 600, 44, 230, 18); g.fill(); g.stroke();
  // boots
  O(22); g.fillStyle='#2c2118';
  g.beginPath(); g.roundRect(166, 820, 66, 44, 14); g.fill(); g.stroke();
  g.beginPath(); g.roundRect(232, 820, 66, 44, 14); g.fill(); g.stroke();
  // torso / vest
  O(26); g.fillStyle = C.vest;
  g.beginPath(); g.roundRect(150, 330, 165, 300, 34); g.fill(); g.stroke();
  // reflective bands
  g.save(); g.beginPath(); g.roundRect(150,330,165,300,34); g.clip();
  g.fillStyle='#ffd97a';
  g.fillRect(150, 400, 165, 26); g.fillRect(150, 470, 165, 26);
  g.restore();
  // arms
  O(24); g.fillStyle = C.vest;
  if (pose === 'point'){
    g.beginPath(); g.moveTo(300, 380); g.lineTo(392, 300); g.stroke();
    g.beginPath(); g.arc(396, 296, 21, 0, Math.PI*2); g.fillStyle=C.skin; g.fill(); g.stroke();
    g.fillStyle = C.vest;
    g.beginPath(); g.moveTo(160, 380); g.lineTo(120, 560); g.stroke();
    g.beginPath(); g.arc(118, 566, 21, 0, Math.PI*2); g.fillStyle=C.skin; g.fill(); g.stroke();
  } else {
    g.beginPath(); g.moveTo(160, 380); g.lineTo(128, 560); g.stroke();
    g.beginPath(); g.arc(126, 566, 21, 0, Math.PI*2); g.fillStyle=C.skin; g.fill(); g.stroke();
    g.fillStyle = C.vest;
    g.beginPath(); g.moveTo(302, 380); g.lineTo(332, 556); g.stroke();
    g.beginPath(); g.arc(334, 562, 21, 0, Math.PI*2); g.fillStyle=C.skin; g.fill(); g.stroke();
  }
  // neck + head
  O(22); g.fillStyle = C.skin;
  g.beginPath(); g.roundRect(214, 288, 38, 52, 12); g.fill(); g.stroke();
  O(28); g.fillStyle = C.skin;
  g.beginPath(); g.ellipse(233, 212, 86, 94, 0, 0, Math.PI*2); g.fill(); g.stroke();
  // helmet
  O(24); g.fillStyle = C.helmet;
  g.beginPath(); g.ellipse(233, 156, 98, 74, 0, Math.PI, Math.PI*2); g.fill(); g.stroke();
  g.beginPath(); g.roundRect(128, 150, 210, 24, 12); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(233,150); g.lineTo(233,102); g.stroke();
  // face
  g.fillStyle = ink;
  const blink = pose === 'blink';
  if (blink){ g.lineWidth=8; g.strokeStyle=ink;
    g.beginPath(); g.moveTo(196,214); g.lineTo(216,214); g.stroke();
    g.beginPath(); g.moveTo(252,214); g.lineTo(272,214); g.stroke();
  } else {
    g.beginPath(); g.arc(206,212,9,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(262,212,9,0,Math.PI*2); g.fill();
  }
  g.lineWidth=8; g.strokeStyle=ink;
  g.beginPath(); g.arc(234, 244, 26, 0.15*Math.PI, 0.85*Math.PI); g.stroke();
  return c;
}

// ---------------------------------------------------------------- asphalt deformation
function deform(t){
  const d = 0.55 + 0.45*easeOut(seg(t, 14.0, 42));
  const amp = 1.65 * d;
  const pos = surfGeo.attributes.position;
  const col = surfGeo.attributes.color;
  for (let i=0;i<pos.count;i++){
    const x = surfBase[i*3], zLocal = surfBase[i*3+2];
    const zWorld = zLocal + surf.position.z;         // world z of this vertex
    const ahead = Math.exp(-Math.pow((zWorld - 3.6)/1.5, 2));    // ridge before the stop line
    const behind = Math.exp(-Math.pow((zWorld + 0.6)/2.0, 2));   // trough after it
    const y = amp * (ahead*1.0 - behind*0.5);
    pos.setY(i, y);
    pos.setX(i, x + amp * 0.18 * ahead);             // slight shove toward travel direction
    const hN = Math.min(1, Math.max(0, (y/1.65)*0.5 + 0.5));
    col.setXYZ(i, 0.30 + hN*0.26, 0.32 + hN*0.26, 0.36 + hN*0.24);
  }
  pos.needsUpdate = true;
  col.needsUpdate = true;
  surfGeo.computeVertexNormals();

  const pp = profGeo.attributes.position, cp = crestGeo.attributes.position;
  for (let k=0;k<=PROF_N;k++){
    const z = PROF_Z0 + (PROF_Z1-PROF_Z0)*k/PROF_N;
    const y = waveAt(z, t);
    pp.setY(k, y);
    cp.setXYZ(k, PROF_X + 0.02, y + 0.02, z);
  }
  pp.needsUpdate = true; cp.needsUpdate = true;
  profGeo.computeVertexNormals();
}

// ---------------------------------------------------------------- camera
const CAM = [
  {t:0,  cy:1.3, h:13, az:76, el:3, lz:4.5},
  {t:6,  cy:1.6, h:15, az:52, el:5, lz:4},
  {t:12, cy:1.4, h:14, az:58, el:6, lz:3.5},
  {t:16, cy:1.2, h:13, az:50, el:6, lz:3},
  {t:21, cy:1.4, h:12, az:40, el:8, lz:2},
  {t:26, cy:1.4, h:16, az:76, el:4, lz:5.5},
  {t:32, cy:1.3, h:18, az:90, el:2, lz:5.5},
  {t:40, cy:1.3, h:18, az:86, el:2, lz:5.5},
  {t:46, cy:1.7, h:15, az:64, el:5, lz:4},
  {t:52, cy:2.2, h:15, az:60, el:6, lz:4.5},
  {t:60, cy:2.6, h:22, az:72, el:6, lz:5},
];
function camAt(t){
  let i=0; while (i<CAM.length-2 && t>CAM[i+1].t) i++;
  const a=CAM[i], b=CAM[i+1];
  const u = easeInOut(clamp01((t-a.t)/(b.t-a.t)));
  const L=(p,q)=>p+(q-p)*u;
  const cy=L(a.cy,b.cy), h=L(a.h,b.h), az=L(a.az,b.az)*Math.PI/180, el=L(a.el,b.el)*Math.PI/180;
  const lz=L(a.lz||2, b.lz||2);
  const dist = (h/2)/Math.tan(FOV*Math.PI/360);
  return {pos:[Math.sin(az)*Math.cos(el)*dist, cy+Math.sin(el)*dist, Math.cos(az)*Math.cos(el)*dist + lz], look:[0,cy,lz]};
}

function setState(t){
  deform(t);
  const c = camAt(t);
  camera.position.set(c.pos[0], c.pos[1], c.pos[2]);
  camera.lookAt(c.look[0], c.look[1], c.look[2]);

  // bus: approach, brake, stop at the line, then leave near the end
  const approach = 1 - easeOut(seg(t, 1.5, 12));
  const leave = 0;
  bus.position.z = -2.2 - approach*14 + leave*30;
  bus.position.y = 0.42 + Math.sin(t*9)*0.012*seg(t,8,12);
  worker.rotation.y = Math.atan2(camera.position.x - worker.position.x, camera.position.z - worker.position.z);
  const pose = (t>17 && t<40) ? (Math.sin(t*1.7) > 0.86 ? 'blink' : (t>22 ? 'point' : 'idle')) : (Math.sin(t*1.5)>0.9?'blink':'idle');
  workerMat.map = pose==='point' ? texPoint : (pose==='blink' ? texBlink : texIdle);
  worker.position.y = 2.75 + Math.sin(t*2.2)*0.05;
}

// ---------------------------------------------------------------- grade + overlay
function drawOverlay(t){
  ctx.save();
  ctx.filter = 'saturate(1.16) contrast(1.06) brightness(1.02)';
  ctx.drawImage(gl.domElement,0,0,W,H);
  ctx.restore();

  // warm grade + vignette
  const wg = ctx.createLinearGradient(0,0,0,H);
  wg.addColorStop(0,'rgba(255,214,150,0.10)');
  wg.addColorStop(0.55,'rgba(255,255,255,0)');
  wg.addColorStop(1,'rgba(24,18,40,0.28)');
  ctx.fillStyle = wg; ctx.fillRect(0,0,W,H);
  const vg = ctx.createRadialGradient(W/2,H*0.46,H*0.34,W/2,H*0.46,H*0.92);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(12,10,24,0.42)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  // subtitle
  const cur = SUBS.find(s=>t>=s.a && t<s.b);
  if (cur){
    const local=t-cur.a, len=cur.b-cur.a;
    ctx.globalAlpha = Math.max(0,Math.min(1,Math.min(local/0.22,(len-local)/0.28)));
    ctx.font='800 58px Helvetica, Arial, sans-serif'; ctx.textAlign='center';
    const lines=[]; let line='';
    for (const w of cur.text.split(' ')){
      const test = line ? line+' '+w : w;
      if (ctx.measureText(test).width > W-150){ lines.push(line); line=w; } else line=test;
    }
    if (line) lines.push(line);
    lines.forEach((ln,i)=>{
      const y = H-300-(lines.length-1)*68 + i*68;
      ctx.lineWidth=16; ctx.strokeStyle='rgba(24,10,30,0.9)'; ctx.lineJoin='round';
      ctx.strokeText(ln,W/2,y); ctx.fillStyle='#ffffff'; ctx.fillText(ln,W/2,y);
    });
    ctx.globalAlpha=1;
  }
  ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(0,H-8,W,8);
  ctx.fillStyle='rgba(242,118,46,0.95)'; ctx.fillRect(0,H-8,W*(t/DUR),8);
}

window.renderAt = function(t){
  setState(t);
  camera.updateMatrixWorld(true);
  gl.render(scene, camera);
  drawOverlay(t);
  return out.toDataURL('image/jpeg', 0.93);
};
window.META = {W,H,FPS,DUR};
window.__READY = true;
</script>
